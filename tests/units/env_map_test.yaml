suite: env map syntax
templates:
  - templates/workloads/deployment.yml
  - templates/batch/job.yml
release:
  name: unit-test

tests:
  - it: renders env maps as string entries in byte order of keys for main and init containers
    template: templates/workloads/deployment.yml
    set:
      deployments.api.containers.api.env:
        lower_case: "x"
        Microservice_RunMigration: "false"
        Microservice_DisplayName: "MC Usage Monitoring"
        Hosting_Address: "http://*"
      deployments.api.initContainers.setup.env:
        RELEASE_NAME: '{{ .Release.Name }}'
        EMPTY_VALUE: ""
        TEMPLATED_BOOLEAN: '{{ false }}'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: Hosting_Address
              value: "http://*"
            - name: Microservice_DisplayName
              value: "MC Usage Monitoring"
            - name: Microservice_RunMigration
              value: "false"
            - name: lower_case
              value: "x"
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: EMPTY_VALUE
              value: ""
            - name: RELEASE_NAME
              value: unit-test
            - name: TEMPLATED_BOOLEAN
              value: "false"

  - it: renders object values and skips null values
    template: templates/workloads/deployment.yml
    set:
      deployments.api.containers.api.env:
        POD_NAME:
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        DROPPED: null
        KEPT: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: KEPT
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

  - it: renders templates in keys and sorts by keys before rendering
    template: templates/workloads/deployment.yml
    set:
      generic.environment: prod
      deployments.api.containers.api.env:
        'APP_{{ upper .Values.generic.environment }}_MODE': "on"
        B_PLAIN: "1"
        '{{ "A_FROM_TEMPLATE" }}': "2"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: APP_PROD_MODE
              value: "on"
            - name: B_PLAIN
              value: "1"
            - name: A_FROM_TEMPLATE
              value: "2"

  - it: fails when a key renders to an empty name
    template: templates/workloads/deployment.yml
    set:
      generic.environment: ""
      deployments.api.containers.api.env:
        '{{ .Values.generic.environment }}': "on"
    asserts:
      - failedTemplate:
          errorPattern: 'env: variable name "\{\{ \.Values\.generic\.environment \}\}" renders to an empty string'

  - it: fails when keys render to the same name
    template: templates/workloads/deployment.yml
    set:
      deployments.api.containers.api.env:
        FOO: "1"
        '{{ "FOO" }}': "2"
    asserts:
      - failedTemplate:
          errorPattern: 'env: variable names "FOO" and "\{\{ \\"FOO\\" \}\}" both render to "FOO"'

  - it: omits env when the map is empty and there are no other entries
    template: templates/workloads/deployment.yml
    set:
      deployments.api.containers.api.env: {}
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: omits env when all map values are null and there are no other entries
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        FAMILY: null
      deployments.api.containers.api.env:
        DROPPED: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: rejects non-string scalar map values
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        INVALID_FAMILY_VALUE: false
      deployments.api.containers.api.env:
        INVALID_CONTAINER_VALUE: 1
    asserts:
      - failedTemplate:
          errorPattern: "deploymentsGeneral/env/INVALID_FAMILY_VALUE"
      - failedTemplate:
          errorPattern: "containers/api/env/INVALID_CONTAINER_VALUE"

  - it: rejects object values other than valueFrom
    template: templates/workloads/deployment.yml
    set:
      deployments.api.containers.api.env:
        EMPTY_OBJECT: {}
        VALUE_OBJECT:
          value: a
        BOTH:
          value: a
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
    asserts:
      - failedTemplate:
          errorPattern: "containers/api/env/EMPTY_OBJECT"
      - failedTemplate:
          errorPattern: "containers/api/env/VALUE_OBJECT"
      - failedTemplate:
          errorPattern: "containers/api/env/BOTH"

  - it: merges family and container maps by key
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        FOO: family
        BAR: family
        KEEP: family
      deployments.api.containers.api.env:
        FOO: container
        BAR: null
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FOO
              value: container
            - name: KEEP
              value: family

  - it: fails when merged family and container keys render to the same name
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        FOO: family
      deployments.api.containers.api.env:
        '{{ "FOO" }}': container
    asserts:
      - failedTemplate:
          errorPattern: 'both render to "FOO"'

  - it: merges family and container maps for Jobs
    template: templates/batch/job.yml
    set:
      jobsGeneral.env:
        MODE: family
        REGION: local
      jobs.migrate.containers.main.env:
        MODE: job
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MODE
              value: job
            - name: REGION
              value: local

  - it: replaces a list from a values file with a map instead of merging them
    template: templates/workloads/deployment.yml
    values:
      - values/env_map_list.values.yaml
    set:
      deployments.api.containers.api.env:
        FROM_MAP: "1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: FROM_MAP
              value: "1"

  - it: renders references and family map entries before a native container list
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        FAMILY: common
      deploymentsGeneral.envsFromConfigmap:
        config: [MODE]
      deployments.api.containers.api.envsFromSecret:
        credentials: [{APP_TOKEN: token}]
      deployments.api.containers.api.env:
        - name: Z_LITERAL
          value: local
        - name: A_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      deployments.api.initContainers.setup.env:
        INIT_ONLY: setup
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: MODE
              valueFrom:
                configMapKeyRef:
                  name: unit-test-config
                  key: MODE
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unit-test-credentials
                  key: token
            - name: FAMILY
              value: common
            - name: Z_LITERAL
              value: local
            - name: A_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: INIT_ONLY
              value: setup

  - it: appends a container map after a family list without removing duplicate names
    template: templates/workloads/deployment.yml
    set:
      deploymentsGeneral.env:
        - name: Z_MODE
          value: common
        - name: A_REGION
          value: local
      deployments.api.containers.api.env:
        Z_MODE: custom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: Z_MODE
              value: common
            - name: A_REGION
              value: local
            - name: Z_MODE
              value: custom
