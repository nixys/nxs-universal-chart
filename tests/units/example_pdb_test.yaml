suite: example pdb
templates:
  - templates/observability/pdb.yaml
release:
  name: smoke-test
  namespace: default

tests:
  - it: renders the PDB example
    values:
      - ../../values.yaml.example
    documentSelector:
      path: metadata.name
      value: universal-blue-api
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.labels.component
          value: api
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.unhealthyPodEvictionPolicy
      - equal:
          path: spec.selector.matchLabels.component
          value: api
      - equal:
          path: spec.selector.matchLabels.tenant
          value: shared

  - it: renders spec.unhealthyPodEvictionPolicy on a cluster with policy/v1
    capabilities:
      majorVersion: "1"
      minorVersion: "31"
    set:
      pdbs:
        api:
          minAvailable: 1
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: omits spec.unhealthyPodEvictionPolicy when the values key is unset
    set:
      pdbs:
        api:
          minAvailable: 1
    asserts:
      - notExists:
          path: spec.unhealthyPodEvictionPolicy

  - it: fails when unhealthyPodEvictionPolicy is set on a cluster without policy/v1
    capabilities:
      majorVersion: "1"
      minorVersion: "20"
    set:
      pdbs:
        api:
          minAvailable: 1
          unhealthyPodEvictionPolicy: AlwaysAllow
    asserts:
      - failedTemplate:
          errorMessage: PDB "api" sets unhealthyPodEvictionPolicy, which requires apiVersion policy/v1 (got "policy/v1beta1")
